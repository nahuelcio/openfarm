name: CI - OpenFarm App

on:
  push:
    branches: [main, develop]
    paths:
      - "openfarm-app/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "openfarm-app/**"
      - ".github/workflows/ci-desktop.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.6"

jobs:
  desktop-frontend:
    name: Desktop Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen

      - name: Lint desktop frontend
        working-directory: openfarm-app
        run: bun run lint

  desktop-backend:
    name: Desktop Backend Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies for Tauri crate checks
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt check
        working-directory: openfarm-app/src-tauri
        run: cargo fmt --check

      - name: Cargo tests
        working-directory: openfarm-app/src-tauri
        run: cargo test
