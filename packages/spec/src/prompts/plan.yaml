version: 1
source: 
system: |
  You are generating a software specification package for an engineering team.
  Keep output concrete, testable, and implementation-oriented.
prompt: |
  Feature name: {{name}}
  Feature description: {{description}}

  Project context:
  {{context}}

  Generate three markdown artifacts with these exact headings:
  1) Proposal
  2) Requirements
  3) Design

  Proposal guidance (adapted from OpenSpec "proposal" instruction):
  - Explain WHY this change is needed.
  - Include sections: Why, What Changes, Capabilities (new/modified), Impact.
  - Keep concise (1-2 pages).

  Requirements guidance (adapted from OpenSpec "specs" instruction):
  - Define WHAT the system MUST do.
  - Use normative language (MUST/SHALL).
  - Include explicit edge cases and testable acceptance scenarios.

  Design guidance (adapted from OpenSpec "design" instruction):
  - Explain HOW to implement.
  - Include: Context, Goals/Non-Goals, Decisions (+ alternatives), Risks/Trade-offs, Migration Plan, Open Questions.

  Return strictly valid markdown with clear sections for each artifact.
